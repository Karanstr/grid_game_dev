[package]
name = "Grid-Game"
version = "0.1.0"
edition = "2024"

[dependencies]
rapier2d = "0.32"
macroquad = "0.4"
glam = { version = "0.30", features = ["serde"] }

serde = "1.0"
serde_json = "1.0"
parking_lot = "0.12"

lilypads = "0.11"
ahash = "0.8"

[profile.dev]
debug = 2  # Full debug info for your crate
debug-assertions = true

[profile.dev.package."*"]
debug = 0  # No debug info for dependencies

[profile.release]
debug = 1
opt-level = 3
lto = "thin"
codegen-units = 1
